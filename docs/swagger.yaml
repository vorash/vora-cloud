basePath: /api/v1
definitions:
  rest.APIKeyInfo:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  rest.AllocationStatus:
    properties:
      allocation_id:
        type: string
      create_time:
        type: integer
      desired_status:
        type: string
      modify_time:
        type: integer
      node_id:
        type: string
      node_name:
        type: string
      status:
        type: string
      task_states:
        additionalProperties:
          type: string
        type: object
    type: object
  rest.CreateKeyRequest:
    properties:
      name:
        type: string
    type: object
  rest.CreateKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
    type: object
  rest.CreateProjectRequest:
    properties:
      cpu_millis:
        type: integer
      default_branch:
        type: string
      health_path:
        type: string
      memory_mib:
        type: integer
      name:
        type: string
      port:
        type: integer
      region:
        type: string
      replicas:
        type: integer
      repo:
        type: string
      slug:
        type: string
    type: object
  rest.CreateUserKeyRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  rest.CreateUserKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        description: Returned once on creation
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  rest.DeleteResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  rest.DeployImageRequest:
    properties:
      commit_sha:
        type: string
      image:
        type: string
      ref:
        type: string
    type: object
  rest.DeployRequest:
    properties:
      cpu:
        type: number
      host:
        type: string
      image:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      memory:
        type: integer
      name:
        type: string
      network_mode:
        type: string
      region:
        type: string
      replicas:
        type: integer
      ssl:
        type: boolean
    type: object
  rest.DeployResponse:
    properties:
      deployment_id:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  rest.DeploymentResponse:
    properties:
      commit_sha:
        type: string
      created_at:
        type: string
      error:
        type: string
      finished_at:
        type: string
      id:
        type: string
      image:
        type: string
      project_id:
        type: string
      ref:
        type: string
      region:
        type: string
      started_at:
        type: string
      status:
        type: string
      url:
        type: string
    type: object
  rest.EnvNamesResponse:
    properties:
      names:
        items:
          type: string
        type: array
    type: object
  rest.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  rest.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/rest.UserInfo'
    type: object
  rest.ProjectResponse:
    properties:
      cpu_millis:
        type: integer
      created_at:
        type: string
      default_branch:
        type: string
      health_path:
        type: string
      id:
        type: string
      memory_mib:
        type: integer
      name:
        type: string
      port:
        type: integer
      region:
        type: string
      replicas:
        type: integer
      repo:
        type: string
      slug:
        type: string
    type: object
  rest.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  rest.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  rest.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  rest.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  rest.RollbackRequest:
    properties:
      deployment_id:
        type: string
    type: object
  rest.SetEnvRequest:
    properties:
      value:
        type: string
    type: object
  rest.StatusResponse:
    properties:
      allocations:
        items:
          $ref: '#/definitions/rest.AllocationStatus'
        type: array
      deployment_id:
        type: string
      desired_instances:
        type: integer
      job_status:
        type: string
      job_type:
        type: string
      message:
        type: string
      running_instances:
        type: integer
    type: object
  rest.UserAPIKeyInfo:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  rest.UserInfo:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      last_login:
        type: string
      name:
        type: string
    type: object
host: localhost:5000
info:
  contact: {}
  description: API for deploying applications to regional k3s clusters
  title: vora-cloud API
  version: "1.0"
paths:
  /admin/keys:
    get:
      consumes:
      - application/json
      description: List all API keys (Admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.APIKeyInfo'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List API keys
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Create a new API key (Admin only)
      parameters:
      - description: Create Key Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.CreateKeyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Create an API key
      tags:
      - admin
  /admin/keys/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an API key by ID (Admin only)
      parameters:
      - description: Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete an API key
      tags:
      - admin
  /admin/users:
    post:
      consumes:
      - application/json
      description: Create a user account (admin API key only). Registration is closed
        by default, so this is how users are added.
      parameters:
      - description: Create User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create a user
      tags:
      - admin
  /applications:
    post:
      consumes:
      - application/json
      description: Deploy an application to the region named in the request. The response
        carries the deployment ID, <region>/<name>.
      parameters:
      - description: Deploy Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.DeployRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.DeployResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Deploy an application
      tags:
      - applications
  /applications/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an application and everything it created. The ID is <region>/<name>;
        send the slash as %2F.
      parameters:
      - description: Deployment ID, <region>/<name> with the slash as %2F
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete an application
      tags:
      - applications
  /applications/{id}/status:
    get:
      consumes:
      - application/json
      description: Get the rollout status of an application. The ID is <region>/<name>;
        send the slash as %2F.
      parameters:
      - description: Deployment ID, <region>/<name> with the slash as %2F
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.StatusResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get application status
      tags:
      - applications
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get access token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and revoke refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        schema:
          $ref: '#/definitions/rest.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the currently logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.UserInfo'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token from cookie or body
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        schema:
          $ref: '#/definitions/rest.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with name, email and password. Off unless ALLOW_REGISTRATION=true;
        otherwise an admin creates users with POST /admin/users.
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /deployments/{id}:
    get:
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.DeploymentResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get a deployment
      tags:
      - deployments
  /health:
    get:
      consumes:
      - application/json
      description: Check if the server is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /projects:
    get:
      description: List the caller's projects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.ProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a project owned by the caller. The slug names the project's
        namespace and host, so it is unique across all users.
      parameters:
      - description: Create Project Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{id}:
    delete:
      description: Tear down the project's namespace in its region, then delete the
        project and its deployments
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.ProjectResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get a project
      tags:
      - projects
  /projects/{id}/deployments:
    get:
      description: Newest first
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.DeploymentResponse'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List a project's deployments
      tags:
      - deployments
    post:
      consumes:
      - application/json
      description: Run an existing image for the project as a new deployment. The
        response is the deployment record; poll it until its status is ready or failed.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Deploy Image Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.DeployImageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.DeploymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Deploy an image
      tags:
      - deployments
  /projects/{id}/env:
    get:
      description: Values are never returned
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.EnvNamesResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List environment variable names
      tags:
      - projects
  /projects/{id}/env/{name}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Variable name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete an environment variable
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Stored encrypted; it applies on the next deployment or redeploy
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Variable name
        in: path
        name: name
        required: true
        type: string
      - description: Set Env Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.SetEnvRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Set an environment variable
      tags:
      - projects
  /projects/{id}/redeploy:
    post:
      description: Run the project's latest image again, which also applies changed
        environment variables
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.DeploymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Redeploy a project
      tags:
      - deployments
  /projects/{id}/rollback:
    post:
      consumes:
      - application/json
      description: Deploy the image of an earlier deployment that became ready, as
        a new deployment
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Rollback Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rest.RollbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rest.DeploymentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Roll back to an earlier deployment
      tags:
      - deployments
  /user/keys:
    get:
      consumes:
      - application/json
      description: List all API keys for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rest.UserAPIKeyInfo'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List user API keys
      tags:
      - user_keys
    post:
      consumes:
      - application/json
      description: Create a new API key for the current user
      parameters:
      - description: Create User Key Request
        in: body
        name: request
