{{define "content"}}
<h1>Projects</h1>
<p><a href="/projects/new">New project</a></p>
{{if .Data}}
<table>
  <thead><tr><th>Name</th><th>Slug</th><th>Region</th><th>Created</th></tr></thead>
  <tbody>
  {{range .Data}}<tr>
    <td><a href="/projects/{{.ID}}">{{.Name}}</a></td><td>{{.Slug}}</td><td>{{.Region}}</td><td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
  </tr>{{end}}
  </tbody>
</table>
{{else}}<p class="muted">No projects yet.</p>{{end}}
{{end}}
